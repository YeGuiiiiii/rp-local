server {
    listen 80 default_server;
    server_name 121.40.147.125;
    root /srv/rp-updates;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://121.40.147.125$request_uri; }
}
server {
    listen 443 ssl default_server;
    server_name 121.40.147.125;
    ssl_certificate /opt/rp-updates/acme/certificates/121.40.147.125.crt;
    ssl_certificate_key /opt/rp-updates/acme/certificates/121.40.147.125.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/rp-updates;
    server_tokens off;
    location = /updates/stable/latest.json {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        try_files $uri =503;
    }
    location ~ ^/updates/stable/RP-local-[0-9.]+\.apk$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=86400, immutable";
        default_type application/vnd.android.package-archive;
        try_files $uri =404;
    }
    location / { return 404; }
}
