    <style id="rphub-vh-fallback">
        /* dvh 需内核 108；更低的内核上 max-h-[calc(100dvh-Nrem)] 整条声明会被丢弃，
           面板失去高度上限、直接撑出屏幕。这里只在「不支持 dvh」时补 vh。
           用 !important 是因为 Tailwind 运行时会往 head 追加 <style>，注入顺序不可控，
           靠源码顺序压不住；108+ 内核 @supports 不匹配，这几条一条都不会生效。 */
        @supports not (height: 100dvh) {
            [class*="max-h-[calc(100dvh-2rem)]"] { max-height: calc(100vh - 2rem) !important; }
            [class*="max-h-[calc(100dvh-5rem)]"] { max-height: calc(100vh - 5rem) !important; }
            [class*="max-h-[calc(100dvh-12rem)]"] { max-height: calc(100vh - 12rem) !important; }
            /* 7rem 那档是 md: 断点用的，必须包在同样的断点里；
               否则手机上会被它按子串命中，抢走 5rem 那档。 */
            @media (min-width: 768px) {
                [class*="max-h-[calc(100dvh-7rem)]"] { max-height: calc(100vh - 7rem) !important; }
            }
        }
    </style>
    <style id="rphub-toast-leave">
        /* 多行 toast 离场收尾会跳一下：theme.css 的 .toast-leave-to 按固定单行高
           （--toast-height = 2.625rem + 2px）折叠 margin-bottom，两行以上只折掉一行的
           高度，剩下的那截在过渡结束瞬间消失。这里改成折叠真实高度：
           app.js 的 onToastBeforeLeave 先把 offsetHeight 写成内联 height，
           下面的 leave-to 再把它压到 0，padding / border 一起归零才收得干净。
           选择器挂 .toast-item 是为了压过 theme.css 的 .toast-leave-*（同一份样式表
           里它在前、特异性也更低）。 */
        .toast-item.toast-leave-active {
            overflow: hidden;
            transition: opacity var(--dur-3) var(--ease-out),
                        transform var(--dur-3) var(--ease-in-out),
                        height var(--dur-3) var(--ease-in-out),
                        padding-top var(--dur-3) var(--ease-in-out),
                        padding-bottom var(--dur-3) var(--ease-in-out),
                        border-top-width var(--dur-3) var(--ease-in-out),
                        border-bottom-width var(--dur-3) var(--ease-in-out),
                        margin-bottom var(--dur-3) var(--ease-in-out);
        }
        .toast-item.toast-leave-to {
            /* !important 是必须的：起点是 before-leave 写进去的内联 height，
               普通类名压不过内联样式。 */
            height: 0 !important;
            min-height: 0 !important;
            padding-top: 0;
            padding-bottom: 0;
            border-top-width: 0;
            border-bottom-width: 0;
            /* 只抵消 flex gap 那 0.5rem —— 自身高度已经由 height:0 折掉了 */
            margin-bottom: calc(-1 * 0.5rem);
        }
    </style>

    <script id="rphub-splash-control-script">
    (function () {
        var MIN_MS = 450;
        var SOFT_MS = 6000;
        var HARD_MS = 25000;
        var start = Date.now();
        var done = false;
        var observed = null;
        var poll = null;
        var splash = null;
        var msg = null;
        var retry = null;
        var status = null;
        var scheduled = false;
        function isReady() {
            var el = document.getElementById('app');
            if (!el) { return false; }
            if (typeof window.tailwind !== 'object') { return false; }
            if (!window.__rpDataReady) { return false; }
            if (el.__vue_app__) { return true; }
            if (!el.hasAttribute('v-cloak') && el.childElementCount > 0) { return true; }
            return false;
        }
        function stopWatch() {
            if (observed) { try { observed.disconnect(); } catch (error) { } observed = null; }
            if (poll) { clearInterval(poll); poll = null; }
        }
        function hide() {
            if (done || !splash) { return; }
            done = true;
            stopWatch();
            window.dispatchEvent(new Event('rp:startup-finished'));
            splash.classList.remove('rphub-splash-hold');
            splash.classList.add('rphub-splash-leave');
            setTimeout(function () { try { if (splash.parentNode) { splash.parentNode.removeChild(splash); } } catch (error) { } }, 180);
        }
        function scheduleHide() {
            if (scheduled) return;
            scheduled = true;
            var wait = Math.max(0, MIN_MS - (Date.now() - start));
            setTimeout(hide, wait);
        }
        function tick() {
            if (done) { return; }
            if (window.__rpDataError && msg && retry) {
                var failedMascot = splash && splash.querySelector('.startup-mascot');
                if (failedMascot && failedMascot.dataset.failed !== '1') {
                    failedMascot.dataset.failed = '1';
                    failedMascot.dataset.uiMascot = 'confused';
                    failedMascot.src = window.RPThemePacks.asset('confused');
                    failedMascot.alt = '陈玥发现存档读取失败';
                    failedMascot.classList.remove('is-loading');
                }
                msg.textContent = '存档读取失败，请检查可用空间后重试';
                retry.style.display = 'inline-block';
                if (status) status.style.pointerEvents = 'auto';
                return;
            }
            if (isReady()) {
                var mascot = splash && splash.querySelector('.startup-mascot');
                if (mascot && mascot.dataset.ready !== '1') {
                    mascot.dataset.ready = '1';
                    var moods = ['welcome', 'album', 'peek'];
                    mascot.src = 'assets/images/chenyue/' + moods[Math.floor(start / 1000) % moods.length] + '.webp';
                    mascot.alt = '欢迎回来的自设小伙伴';
                    mascot.classList.remove('is-loading');
                    splash.classList.add('is-ready');
                    if (msg) msg.textContent = window.__rpHasSavedChat ? '正在回到你的故事…' : '准备好，去看看角色卡吧。';
                }
                scheduleHide();
            }
        }
        // 启动期节流：MutationObserver 的回调经 rAF 合并，同一帧最多判定一次
        var _tickPending = false;
        function onMutate() {
            if (_tickPending || done) { return; }
            _tickPending = true;
            requestAnimationFrame(function () { _tickPending = false; tick(); });
        }
        function watch() {
            if (isReady()) { tick(); return; }
            var root = document.body;
            try {
                observed = new MutationObserver(onMutate);
                observed.observe(root, { childList: true, subtree: true, attributes: true, attributeFilter: ['v-cloak'] });
            } catch (error) { observed = null; }
            poll = setInterval(tick, 300);
        }
        function init() {
            try {
            splash = document.querySelector('.entry-transition');
            if (!splash) { setTimeout(init, 100); return; }
            status = document.createElement('div');
            status.className = 'rphub-splash-status';
            msg = document.createElement('span');
            msg.textContent = '正在加载…';
            retry = document.createElement('button');
            retry.type = 'button';
            retry.textContent = '重新加载';
            retry.addEventListener('click', function () { try { location.reload(); } catch (error) { } });
            status.appendChild(msg);
            status.appendChild(retry);
            splash.appendChild(status);
            watch();
            setTimeout(function () { if (!done && !isReady() && msg) { msg.textContent = '仍在加载，请稍候…'; } }, SOFT_MS);
            setTimeout(function () {
                if (done || isReady() || !retry) { return; }
                if (msg) { msg.textContent = '加载时间较长，可能网络或脚本异常'; }
                retry.style.display = 'inline-block';
                if (status) { status.style.pointerEvents = 'auto'; }
            }, HARD_MS);
            } catch (error) {
                if (splash) { splash.classList.remove('rphub-splash-hold'); splash.classList.add('rphub-splash-leave'); }
            }
        }
        if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); } else { init(); }
    })();
    </script>

        <style id="rphub-island-flex-fix">
        /*
         * 移动端视口安全兜底、防顶栏上移死锁与 GPU 显存保护：
         * 1. 根节点锁定：html/body 固定定位，彻底剥夺 Android WebView 对文档 root 的程序性滚动能力。
         * 2. 顶栏绝对防上移：在移动端将顶栏容器固定在物理屏幕顶端 (position: fixed !important; top: 0 !important;)，
         *    彻底免疫任何由 IME / Focus 触发的 37px 向上滚动偏移。
         * 3. 视口溢出兜底：root 用 overflow: hidden，非 root 容器用 overflow: clip
         *    （hidden 拦不住程序性滚动，见下方 2.8.13 注释）。
         * 4. 彻底移除 input-area-mobile 的 position: relative 规则，保持官方 absolute 悬浮岛定位。
         * 5. 彻底移除聊天区 padding-bottom 压缩规则，保留官方 pb-52 悬浮让位空间。
         * 6. 显存保护：移动端关闭背景模糊 .char-bg-blur，防止超大头像 Base64 触发 GPU 显存溢出。
         */
        @media (max-width: 768px) {
            html, body {
                position: fixed !important;
                width: 100% !important;
                height: 100% !important;
                top: 0 !important;
                left: 0 !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            /* root：overflow: clip 在 root 上不生效（浏览器对 root 的 overflow 传播机制不同），
             * 保留 hidden 作兜底；真正掐断程序性滚动靠下面那组非 root 容器。 */
            html, body {
                overflow: hidden !important;
                overscroll-behavior: none;
                max-height: 100% !important;
            }
            /* [rphub 2.8.13] 非 root 容器改用 clip：
             *   overflow: hidden 只拦用户手势滚动，拦不住「浏览器把聚焦元素滚入视野」这类
             *   程序性滚动。.char-bg-blur 的 inset:-1rem + height:calc(--chat-bg-height + 2rem)
             *   向上下各溢出 16 CSS px，被 .chat-view-root 的 hidden 收成 16px 可滚空间
             *   ⇒ 聚焦输入框时正文 + 输入岛整体上移 16 CSS px（≈36 物理 px），
             *     而顶栏是 position:fixed 不受影响 ⇒ 表现为「标题正常、输入栏和正文上移」。
             *   离线实测（过程文件/_vpd-2813/repro.html）：hidden 可置入 scrollTop=16，
             *   clip 后为 0，且 #msglist 内部滚动零回归。 */
            #app, .app-main, .chat-view-root {
                overflow: clip !important;
                overscroll-behavior: none;
                max-height: 100% !important;
            }
            /* 顶栏物理钉死在屏幕顶端，防止 37px 上移被状态栏遮挡 */
            .chat-view-root > div.absolute.top-0 {
                position: fixed !important;
                top: 0 !important;
                left: 0 !important;
                right: 0 !important;
            }
            .chat-view-root[style*="display: none"] {
                display: none !important;
            }
            .management-view {
                background-color: var(--c-canvas, rgb(var(--gray-50)));
                min-height: 0;
            }
            .char-bg-blur {
                filter: none !important;
                -webkit-filter: none !important;
            }
        }
    </style>
<style id="rphub-perf-style">
        /* [rphub 2.8.66] 点击高亮：Android WebView 默认会给每个可点元素画一块半透明方块，
           看着就是「点一下闪一下」。官网全站没关过（tap-highlight 出现 0 次）。 */
        * { -webkit-tap-highlight-color: transparent; }

        @media (max-width: 768px) {
            /* [rphub 2.8.66] 官网的滚动入场动画：每条消息初始 opacity:0 + translate3d，
               靠 IntersectionObserver 加 .reveal-active 才亮，过渡 0.5s/0.6s。
               移动端关掉 —— 少一次整屏淡入，也少几百个元素的逐帧合成。
               官网自己在同一个断点里已关 backdrop-filter，唯独漏了这段。 */
            .scroll-reveal-left,
            .scroll-reveal-right,
            .scroll-reveal-center {
                opacity: 1 !important;
                transform: none !important;
                transition: none !important;
            }
        }
    </style>
    <style id="rphub-zen-style">
        /* [rphub 2.8.66] 纯净观看：恢复键就是头部那颗眼睛按钮本身，留在原位不动。
           头部遮罩一藏，白字会落在浅色底上看不清，所以给它自己的底与描边；
           全部吃官网主题变量，暗色主题自动跟随。 */
        .rphub-zen-toggle--on {
            position: relative;
            z-index: 56;
            color: var(--c-text-2);
            background: var(--c-elevated);
            /* 描边必须用 box-shadow 画：border 会参与布局，32x32 会被撑成 34x34，按钮就挪位了。 */
            box-shadow: 0 0 0 1px var(--c-border), 0 2px 10px rgb(0 0 0 / 0.14);
            -webkit-tap-highlight-color: transparent;
        }
        .rphub-zen-toggle--on:active { transform: scale(0.94); }
    </style>
<style id="rphub-composer-style">

    <style id="rphub-memory-mode-fix">
        /*
         * 修复「记忆模式三档切换器指示块拉长 / 错位」。
         *
         * 根因：官网线上 assets/css/styles.css 里没有 .segmented-switch--three 的规则，
         *   只有默认两档宽度 calc(50% - 0.25rem) 与 .segmented-switch--four。
         *   而 styles.css 不在补丁范围内（PatchEngine.isPatchableKey 不含它，
         *   resourceFor 的 flag 为 0），后台 scheduleRefresh 会把线上原始 CSS 直接写进缓存
         *   且不打补丁，拦截又走「缓存优先」⇒ 内置 seed 里已有的三档规则被线上版本覆盖。
         *   结果指示块保持两档的 50% 宽度，横跨盖住相邻档位文字。
         *
         * 修法：按线上布局常量补齐。容器左右内边距各 0.25rem（合计 0.5rem），
         *   三等分宽度 = calc(33.333% - 0.166rem)；translateX 的百分比是相对自身宽度，
         *   故第 2/3 档位移为 100% / 200%。只改几何不改配色，暗色模式不受影响。
         */
        .segmented-switch--three .segmented-switch__indicator {
            width: calc(33.333% - 0.166rem) !important;
        }

        .segmented-switch--three .segmented-switch__indicator.is-position-2 {
            transform: translateX(100%) !important;
        }

        .segmented-switch--three .segmented-switch__indicator.is-position-3 {
            transform: translateX(200%) !important;
        }
    </style>

                                            <span class="text-xs font-mono font-bold text-gray-600 bg-gray-50 border border-gray-200 rounded-lg px-2.5 py-1 whitespace-nowrap">{{ settings.uiTemplateKeepFloors }} 楼</span>
                                        </div>
                                        <input v-model.number="settings.uiTemplateKeepFloors" type="range" min="1" max="20" step="1"
                                            class="compact-range w-full h-1.5 bg-primary-100 rounded-lg appearance-none cursor-pointer accent-primary-500">
                                        <p class="mt-2 text-[11px] leading-relaxed text-gray-400">按完整对话楼计算；更早 UI 模板滚到附近时再重建，降低长聊天内存占用。</p>
                                    </div>
                                </div>
                            </div>

                            <!-- Backup & Transfer: the details live in its dialog -->
                            <div v-if="cloudBackup.enabled" class="pt-6 border-t border-gray-100 mt-6">
                                <h4 class="settings-subheading flex items-center mb-4">
                                    <svg class="w-4 h-4 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12">
                                        </path>
                                    </svg>
                                    备份与转移
                                </h4>
                                <div class="grid grid-cols-2 gap-3">
                                    <button type="button" @click="openCloudBackup('upload')" class="settings-action gap-2 min-h-[2.875rem]">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                                        上传备份
                                    </button>
                                    <button type="button" @click="openCloudBackup('download')" class="settings-action gap-2 min-h-[2.875rem]">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                        下载备份
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Runtime Environment (read-only) -->
                    <details class="settings-card">
                        <summary class="settings-card__header cursor-pointer">
                            <span class="font-semibold">
                                <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><use href="#icon-settings"></use></svg>
                                运行环境
                            </span>
                        </summary>
                        <div class="settings-card__body">
                            <button type="button" class="settings-action" @click="refreshRuntimeEnv()">重新读取</button>
                        </div>

                        <div class="settings-card__body space-y-3">
                            <template v-if="runtimeEnv">
                                <div class="text-xs space-y-2">
                                    <div class="flex gap-2"><span class="w-28 flex-none text-gray-500">WebView 内核</span><span class="flex-1 break-all font-mono">{{ runtimeEnv.chrome }}</span></div>
                                    <div class="flex gap-2"><span class="w-28 flex-none text-gray-500">判定</span><span class="flex-1">{{ runtimeEnv.engineVerdict }}</span></div>
                                    <div class="flex gap-2"><span class="w-28 flex-none text-gray-500">设备内存</span><span class="flex-1">{{ runtimeEnv.deviceRam }}</span></div>
                                    <div class="flex gap-2"><span class="w-28 flex-none text-gray-500">JS 堆上限</span><span class="flex-1">{{ runtimeEnv.heapLimit }}</span></div>
                                    <div class="flex gap-2"><span class="w-28 flex-none text-gray-500">JS 堆已用</span><span class="flex-1">{{ runtimeEnv.heapUsed }}（{{ runtimeEnv.heapRatio }}）</span></div>
                                    <div class="flex gap-2"><span class="w-28 flex-none text-gray-500">聊天渲染</span><span class="flex-1">{{ runtimeEnv.renderWindow }}</span></div>
                                    <div class="flex gap-2"><span class="w-28 flex-none text-gray-500">角色列表</span><span class="flex-1">{{ runtimeEnv.charPage }}</span></div>
                                    <div class="flex gap-2"><span class="w-28 flex-none text-gray-500">UA 原文</span><span class="flex-1 break-all font-mono text-gray-400">{{ runtimeEnv.ua }}</span></div>
                                </div>
                                <button type="button" class="settings-action" @click="copyRuntimeEnv()">复制诊断信息</button>
                            </template>
                            <p v-else class="text-xs text-gray-400">尚未读取。</p>
                        </div>
                    </details>

                </div>
            </div>

            <!-- Presets View -->
            <div v-if="currentView === 'presets'" class="management-view">
                <settings-page-header title="预设管理" @menu="shellGoBack">
                    <template #icon>
                        <svg class="w-6 h-6 md:w-7 md:h-7 mr-2 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path>
                        </svg>
                    </template>
                    <button type="button" @click="exportPresetGroups()" class="settings-icon-button" title="导出全部分组" aria-label="导出全部分组">
                        <shell-icon name="Download"></shell-icon>
                    </button>
                    <label class="settings-icon-button cursor-pointer" title="导入预设或分组">
                        <shell-icon name="Upload"></shell-icon>
                        <input type="file" accept=".json" @change="importPresets($event, null)" aria-label="导入预设或分组" class="sr-only">
                    </label>
                    <button type="button" @click="openPresetGroupForm()" class="settings-create-button" title="新建分组" aria-label="新建分组">
                        <shell-icon name="Plus"></shell-icon>
                    </button>
                </settings-page-header>

                <form v-if="showPresetGroupForm" class="preset-group-form" aria-label="预设分组名称" @submit.prevent="savePresetGroup" @keydown.esc="showPresetGroupForm = false">
                    <label for="preset-group-name">{{ presetGroupEditing ? '重命名分组' : '新建分组' }}</label>
                    <div>
                        <input id="preset-group-name" v-model="presetGroupDraft" type="text" autocomplete="off"
                            placeholder="分组名称" :aria-invalid="!!presetGroupError" :aria-describedby="presetGroupError ? 'preset-group-error' : null">
                        <button type="submit" class="settings-icon-button" title="保存分组" aria-label="保存分组"><shell-icon name="Check"></shell-icon></button>
                        <button type="button" class="settings-icon-button" title="取消" aria-label="取消新建分组" @click="showPresetGroupForm = false"><shell-icon name="X"></shell-icon></button>
                    </div>
                    <p v-if="presetGroupError" id="preset-group-error" role="alert">{{ presetGroupError }}</p>
                </form>
                <div id="presets-list" class="preset-group-directory" aria-label="全部预设分组">
                    <section v-for="(group, groupIndex) in presetGroups" :key="group.key" class="preset-group"
                        :class="{'is-expanded': activePresetGroupName === group.key}">
                        <div class="preset-group-row">
                            <button type="button" class="preset-group-open"
                                @click="openPresetGroup(activePresetGroupName === group.key ? null : group.key)"
                                :aria-expanded="activePresetGroupName === group.key"
                                :aria-controls="'preset-group-' + groupIndex" :aria-label="'打开分组：' + group.label">
                                <shell-icon name="ChevronRight"></shell-icon>
                                <strong>{{ group.label }}</strong><small>{{ group.items.length }} 项</small>
                            </button>
                            <label class="relative inline-flex items-center flex-shrink-0 cursor-pointer"
                                :title="isPresetGroupAllEnabled(group) ? '关闭该组全部预设' : '开启该组全部预设'">
                                <input type="checkbox" role="switch" :aria-label="'启用分组：' + group.label"
                                    :disabled="!group.items.length" :checked="isPresetGroupAllEnabled(group)"
                                    @change="togglePresetGroupEnabled(group)" class="settings-toggle-input sr-only">
                                <div class="settings-toggle settings-toggle--compact"></div>
                            </label>
                        </div>
                        <div v-if="activePresetGroupName === group.key" :id="'preset-group-' + groupIndex" class="preset-group-body">
                            <div class="preset-group-toolbar">
                                <label class="settings-action preset-group-import" title="导入到此分组">
                                    <shell-icon name="Upload"></shell-icon><span>导入预设</span>
                                    <input type="file" accept=".json" class="sr-only" :aria-label="'导入到分组：' + group.label"
                                        @change="importPresets($event, group.key)">
                                </label>
                                <button type="button" class="settings-icon-button" @click="createPreset" title="新建预设" aria-label="新建预设"><shell-icon name="Plus"></shell-icon></button>
                                <details class="preset-group-menu" @keydown.esc.stop="$event.currentTarget.open = false">
                                    <summary class="settings-icon-button" title="更多分组操作" :aria-label="'更多分组操作：' + group.label"><shell-icon name="MoreHorizontal"></shell-icon></summary>
                                    <div @click="$event.currentTarget.parentElement.open = false">
                                        <button type="button" @click="togglePresetBatchMode"><shell-icon name="Check"></shell-icon>{{isPresetBatchManaging ? '退出批量管理' : '批量管理'}}</button>
                                        <button type="button" @click="openExportModal('presets')"><shell-icon name="Download"></shell-icon>导出组内预设</button>
                                        <button type="button" @click="exportPresetGroups(group.key)"><shell-icon name="FolderOpen"></shell-icon>导出整个分组</button>
                                        <button v-if="group.key !== 'STA1N官方分组'" type="button" @click="openPresetGroupForm(true)"><shell-icon name="NotebookPen"></shell-icon>重命名分组</button>
                                        <button type="button" @click="deletePresetGroup(group)" :disabled="!group.items.length"><shell-icon name="Trash2"></shell-icon>删除组内预设</button>
                                    </div>
                                </details>
                            </div>
                            <button v-if="isPresetBatchManaging" type="button" @click="toggleSelectGroupPresets(group)" class="shell-text-link">
                                {{ isPresetGroupAllSelected(group) ? '取消本组' : '全选本组' }}
                            </button>
                        <div v-if="!group.items.length" class="preset-group-empty">
                            <p>这个分组还没有预设</p>
                        </div>
                        <div class="sortable-list" :data-preset-group="group.key">
                        <div v-for="entry in group.items" :key="entry.preset.name + entry.index"
                            :data-preset-index="entry.index"
                            class="sortable-list-item group" :class="{ 'is-off': !isPresetEnabled(entry.preset), 'ring-2 ring-primary-500 bg-primary-50/40': isPresetBatchManaging && isPresetSelected(entry.index) }" @click="isPresetBatchManaging ? toggleSelectPreset(entry.index) : null">
                        <div class="sortable-item-main">
                            <div v-if="isPresetBatchManaging" class="flex items-center justify-center w-7 h-7 mr-1 flex-shrink-0" @click.stop>
                                <input type="checkbox" :checked="isPresetSelected(entry.index)"
                                    @change="toggleSelectPreset(entry.index)"
                                    class="w-4 h-4 rounded border-gray-300 text-primary-600 focus:ring-primary-500 accent-primary-600 cursor-pointer">
                            </div>
                            <div v-else class="sortable-list-handle" title="拖动排序">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M4 8h16M4 16h16"></path>
                                </svg>
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="sortable-item-heading">
                                    <h3 class="truncate">{{ entry.preset.name }}</h3>
                                    <span class="meta-badge meta-badge--desktop" :class="getPresetRoleBadgeClass(entry.preset)">
                                        {{ getPresetRoleDisplayLabel(entry.preset) }}
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div class="sortable-item-actions">
                            <label class="relative inline-flex items-center"
                                :class="entry.preset.name === 'COT' && isTruncationEnabled ? 'cursor-not-allowed' : 'cursor-pointer'"
                                :title="entry.preset.name === 'COT' && isTruncationEnabled ? 'Gemini抗截断已临时关闭 COT，关闭抗截断或切换模型后恢复原设置' : null">
                                <input type="checkbox" :checked="isPresetEnabled(entry.preset)"
                                    :disabled="entry.preset.name === 'COT' && isTruncationEnabled"
                                    @change="entry.preset.enabled = $event.target.checked" class="settings-toggle-input sr-only">
                                <div class="settings-toggle"></div>
                            </label>
                            <div class="sortable-item-buttons">
                                <button @click="editPreset(entry.index)"
                                    class="item-action-button item-action-button--edit"
                                    title="编辑">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor"><use href="#icon-edit"></use></svg>
                                </button>
                                <button @click="deletePreset(entry.index)"
                                    class="item-action-button item-action-button--delete"
                                    title="删除">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor"><use href="#icon-delete"></use></svg>
                                </button>
                            </div>
                        </div>
                        </div>
                        </div>
                    </div>
                    </section>
                </div>
                <!-- 批量管理底部悬浮操作栏 -->
                <transition enter-active-class="transition-all duration-200 ease-out"
                    enter-from-class="opacity-0 translate-y-8"
                    enter-to-class="opacity-100 translate-y-0"
                    leave-active-class="transition-all duration-150 ease-in"
                    leave-from-class="opacity-100 translate-y-0"
                    leave-to-class="opacity-0 translate-y-8">
                    <div v-if="isPresetBatchManaging"
                        class="fixed bottom-4 left-3 right-3 md:left-auto md:right-8 md:w-96 z-40 bg-white/95 dark:bg-gray-800/95 backdrop-blur-md rounded-2xl border border-gray-200/90 dark:border-gray-700/80 shadow-2xl p-3 flex flex-col gap-2.5">
                        <div class="flex items-center justify-between px-1">
                            <span class="text-xs font-bold text-gray-700 dark:text-gray-200">
                                已选 <span class="text-primary-600 font-mono text-sm">{{ selectedPresetIndices.length }}</span> 项
                            </span>
                            <div class="flex items-center gap-2">
                                <button type="button" @click="selectAllPresets"
                                    class="text-xs text-primary-600 hover:underline font-semibold">全选本组</button>
                                <span class="text-gray-300">|</span>
                                <button type="button" @click="clearSelectedPresets"
                                    class="text-xs text-gray-500 hover:text-gray-700 font-semibold">清空</button>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <button type="button" @click="openPresetBatchMoveModal"
                                :disabled="!selectedPresetIndices.length"
                                class="py-2 px-2 bg-primary-600 hover:bg-primary-700 text-white rounded-xl text-xs font-bold shadow-sm transition-all disabled:opacity-40 disabled:pointer-events-none flex items-center justify-center gap-1 active:scale-95">
                                <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path>
                                </svg>
                                移动分组
                            </button>
                            <button type="button" @click="batchTogglePresetsEnabled(true)"
                                :disabled="!selectedPresetIndices.length"
                                class="py-2 px-2 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-700 rounded-xl text-xs font-bold transition-all disabled:opacity-40 disabled:pointer-events-none active:scale-95">
                                批量开启
                            </button>
                            <button type="button" @click="batchTogglePresetsEnabled(false)"
                                :disabled="!selectedPresetIndices.length"
                                class="py-2 px-2 bg-rose-50 hover:bg-rose-100 border border-rose-200 text-rose-700 rounded-xl text-xs font-bold transition-all disabled:opacity-40 disabled:pointer-events-none active:scale-95">
                                批量关闭
                            </button>
                            <button type="button" @click="batchDeletePresets"
                                :disabled="!selectedPresetIndices.length"
                                class="py-2 px-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold shadow-sm transition-all disabled:opacity-40 disabled:pointer-events-none active:scale-95">
                                删除选中
                            </button>
                        </div>
                    </div>
                </transition>

                <!-- 批量移动分组弹窗 -->
                <div v-if="showPresetBatchMoveModal"
                    class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-end md:items-center justify-center p-0 md:p-4"
                    @click.self="showPresetBatchMoveModal = false">
                    <div class="bg-white dark:bg-gray-800 w-full md:max-w-md rounded-t-2xl md:rounded-2xl p-5 shadow-2xl flex flex-col gap-4 animate-fade-in">
                        <div class="flex items-center justify-between border-b border-gray-100 dark:border-gray-700 pb-3">
                            <h3 class="font-bold text-gray-800 dark:text-gray-100 text-base">批量调整分组（共 {{ selectedPresetIndices.length }} 项）</h3>
                            <button type="button" @click="showPresetBatchMoveModal = false" class="text-gray-400 hover:text-gray-600 text-xl leading-none">×</button>
                        </div>
                        <div class="space-y-3">
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-1.5 uppercase">选择现有分组</label>
                                <div class="grid grid-cols-2 gap-2 max-h-48 overflow-y-auto p-1 custom-scrollbar">
                                    <button v-for="g in presetGroups" :key="g.key"
                                        type="button" @click="presetBatchTargetGroup = g.label"
                                        class="px-3 py-2 rounded-xl text-xs font-bold text-left border transition-all truncate"
                                        :class="presetBatchTargetGroup === g.label ? 'bg-primary-50 text-primary-700 border-primary-300 ring-1 ring-primary-300' : 'bg-gray-50 text-gray-700 border-gray-200 hover:bg-gray-100'">
                                        {{ g.label }}
                                    </button>
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-1.5 uppercase">或输入新分组名称</label>
                                <input v-model="presetBatchTargetGroup" type="text" placeholder="输入分组名称（留空即默认分组）"
                                    class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl px-3.5 py-2.5 text-sm text-gray-800 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500">
                            </div>
                        </div>
                        <div class="flex gap-2.5 pt-2 border-t border-gray-100 dark:border-gray-700">
                            <button type="button" @click="showPresetBatchMoveModal = false"
                                class="flex-1 py-2.5 px-4 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-sm font-semibold transition-all">取消</button>
                            <button type="button" @click="applyPresetBatchMove"
                                class="flex-1 py-2.5 px-4 bg-primary-600 hover:bg-primary-700 text-white rounded-xl text-sm font-bold shadow-md transition-all active:scale-95">确认移动</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- UI Templates View -->
            <ui-templates-view :show="currentView === 'uitemplates'" :templates="managedUiTemplates"
                :has-character="!!currentCharacter" :show-settings="showUiTemplateSettings"
                :settings="settings" :update-status="uiTemplateUpdateStatus"
                :help-topic="settingsHelpTopic" :analysis-depth="uiTemplateAnalysisDepthSlider"
                @menu="shellGoBack" @export="openExportModal('uitemplates')"
                @import="importUiTemplates" @create="createUiTemplate"
                @update:show-settings="showUiTemplateSettings = $event"
                @update:help-topic="settingsHelpTopic = $event"
                @analyze="updateUiTemplatesFromChat()"
                @select-model="openModelSelector('uiTemplateModel')"
                @update:analysis-depth="uiTemplateAnalysisDepthSlider = $event"
                :is-fetching-ui-template-models="isFetchingUiTemplateModels"
                @fetch-models="fetchUiTemplateModels(true)"
                @edit="editUiTemplate(currentUiTemplates.indexOf(managedUiTemplates[$event]))" @delete="deleteUiTemplate(currentUiTemplates.indexOf(managedUiTemplates[$event]))">
            </ui-templates-view>
            <!-- Regex View -->
            <div v-if="currentView === 'regex'" class="management-view">
                <settings-page-header title="正则脚本" @menu="shellGoBack">
                    <template #icon>
                        <svg class="w-6 h-6 md:w-7 md:h-7 mr-2 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
                        </svg>
                    </template>
                    <button @click="openExportModal('regex')" class="settings-icon-button" title="导出">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor"><use href="#icon-export"></use></svg>
                    </button>
                    <label class="settings-icon-button cursor-pointer" title="导入">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><use href="#icon-import"></use></svg>
                        <input type="file" accept=".json" @change="importRegex" class="hidden">
                    </label>
                    <button @click="createRegex" class="settings-create-button" title="新建脚本">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                        </svg>
                    </button>
                </settings-page-header>
                <div id="regex-list" class="sortable-list">
                    <div v-for="({script, index}) in managedRegexScripts" :key="getSortableItemKey(script)" :data-resource-index="index"
                        class="sortable-list-item group" :class="{ 'is-off': script.enabled !== true }">
                        <div class="sortable-item-main">
                            <div class="sortable-list-handle" title="拖动排序">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M4 8h16M4 16h16"></path>
                                </svg>
                            </div>
                            <div class="min-w-0">
                                <div class="sortable-item-heading">
                                    <h3 class="truncate">{{ script.name }}</h3>
                                    <span class="meta-badge meta-badge--desktop"
                                        :class="script.scope === 'global' ? 'meta-badge--global' : 'meta-badge--bound'">
                                        {{ script.scope === 'global' ? '全局' : '绑定' }}
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div class="sortable-item-actions">
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" v-model="script.enabled" class="settings-toggle-input sr-only" :true-value="true"
                                    :false-value="false">
                                <div class="settings-toggle"></div>
                            </label>
                            <div class="sortable-item-buttons">
                                <button @click="editRegex(index)"

            + '<div class="tk-label">模式</div><div class="tk-modes">' + modes + '</div>'
            + '<div class="tk-label">主色</div><div class="tk-swatches">' + swatches
            + '<input type="color" value="' + (accent || navDotColor()) + '" aria-label="自定义主色">'
            + '<button type="button" class="tk-reset">恢复默认</button></div>'
            + '<p class="tk-note">护眼是暖纸底、压蓝光的阅读配色；暗护眼是它的夜间版。跟随系统会根据系统深浅色自动选，且不会写死偏好（避免重启闪烁）。</p>';
    }

    function navDotColor() {
        return (schemeNow() === 'eye' || schemeNow() === 'eyeNight') ? '#4f8f4a' : '#5a6ff0';
    }

    function ensureUiStyle() {
        if (document.getElementById(UI_STYLE_ID)) return;
        var el = document.createElement('style');
        el.id = UI_STYLE_ID;
        el.textContent = uiCss();
        (document.head || root).appendChild(el);
    }

    function navSections() {
        var panel = document.getElementById('app-navigation-panel');
        if (!panel) return null;
        return {
            panel: panel,
            content: panel.querySelector('.app-navigation-content'),
            sections: panel.querySelectorAll('.app-navigation-section')
        };
    }

    function buildInline() {
        var host = document.createElement('section');
        host.className = 'app-navigation-section';
        host.id = INLINE_ID;
        host.hidden = true;
        return host;
    }

    function renderInline(host) {
        host.innerHTML = inlineHtml();
        host.querySelectorAll('.tk-mode').forEach(function (b) {
            b.addEventListener('click', function () { setScheme(b.dataset.scheme); });
        });
        host.querySelectorAll('.tk-swatch').forEach(function (b) {
            b.addEventListener('click', function () { setAccent(b.dataset.color); });
        });
        var picker = host.querySelector('input[type=color]');
        if (picker) picker.addEventListener('input', function (e) { setAccent(e.target.value); });
        var reset = host.querySelector('.tk-reset');
        if (reset) reset.addEventListener('click', function () { setAccent(''); });
    }

    function syncUi() {
        if (!isTop || window.RPLocalWorkspace) return;
        var found = navSections();
        if (!found) return;
        ensureUiStyle();

        var entry = found.panel.querySelector('.app-navigation-item[' + NAV_FLAG + ']');
        if (!entry) {
            // 「高级」分组：按 h3 文本定位，找不到就退回最后一个分组
            var target = null;
            found.sections.forEach(function (sec) {
                var h3 = sec.querySelector('h3');
                if (h3 && h3.textContent.trim() === '高级') target = sec;
            });
            if (!target) target = found.sections[found.sections.length - 1];
            var grid = target && target.querySelector('.app-navigation-grid');
            if (!grid) return;
            grid.insertAdjacentHTML('beforeend', navEntryHtml());
            entry = grid.querySelector('.app-navigation-item[' + NAV_FLAG + ']');
            var host = buildInline();
            target.parentNode.insertBefore(host, target.nextSibling);
            renderInline(host);
            entry.addEventListener('click', function () {
                var open = host.hidden;
                host.hidden = !open;
                entry.setAttribute('aria-expanded', open ? 'true' : 'false');
                if (open) {
                    if (entry.classList) entry.classList.add('is-current');
                    try { host.scrollIntoView({ block: 'nearest' }); } catch (_) { /* ignore */ }
                } else if (entry.classList) entry.classList.remove('is-current');
            });
        }

        var dot = entry && entry.querySelector('.tk-nav-dot');
        if (dot) dot.style.background = accentNow() || navDotColor();

        // 展开状态下同步选中态（改档/换色后即时反映）
        var inline = document.getElementById(INLINE_ID);
        if (inline && !inline.hidden) renderInline(inline);
    }

    /* ---------- 生命周期 ---------- */
    window.addEventListener('rphub-theme-change', function () {
        // 别的入口（官网抽屉开关 / 原生壳）改了主题：把档位对齐，避免状态打架
        if (resolvedTheme(schemeNow()) !== themeNow()) {
            var s = schemeNow();
            if (s !== 'auto' && s !== 'eye' && s !== 'eyeNight') {
                put(KEY_SCHEME, themeNow() === 'dark' ? 'night' : 'day');
                put(KEY_APPEARANCE, themeNow());
            }
        }
        ensureStyle(document, kitCss());
        scheduleFrameSync(0);
        syncUi();
    });
    window.addEventListener('storage', function (e) {
        // 只对主题相关键反应；原来任何 rphub-* 键（含拖动坐标）都会触发重算
        if (!e || !e.key) return;
        if (e.key !== KEY_APPEARANCE && e.key !== KEY_SCHEME && e.key !== KEY_ACCENT) return;
        paint({ persist: false });
    });
    try {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        var onSys = function () {
            // auto 档才跟随；且限流兜底，系统偏好抖动也滚不成循环
            if (schemeNow() !== 'auto') return;
            if (resolvedTheme('auto') === themeNow()) return;
            paint({ persist: false });
        };
        if (mq.addEventListener) mq.addEventListener('change', onSys);
        else if (mq.addListener) mq.addListener(onSys);
    } catch (_) { /* ignore */ }
    document.addEventListener('load', function (e) {
        if (e.target && e.target.tagName === 'IFRAME') applyToFrame(e.target);
    }, true);

    var uiTimer = 0;
    var lastFrameCount = -1;   // [rphub 2.8.77] 只在同源 iframe 数量变化时重刷
    var observer = null;
    try {
        observer = new MutationObserver(function () {
            if (uiTimer) return;
            uiTimer = setTimeout(function () {
                uiTimer = 0;
                if (!isTop) return;
                // [rphub 2.8.77] 两处收敛。第三方原版是「每 200ms 无条件 syncUi()
                // + scheduleFrameSync(300)」，流式输出期会一直跑，而且 applyToFrame
                // 会重写同源 iframe 里的 <style>（整段 kitCss 重新 set textContent）。
                //   ① 抽屉是 v-if="open"，关着的时候页面里根本没有入口要维护，
                //      syncUi 白跑；
                //   ② iframe 只在数量变化时补刷 —— 首次挂上由下面的 load 监听补，
                //      切档换色由 paint() 的 scheduleFrameSync(0) 立即刷，都不受影响。
                if (!document.getElementById('app-navigation-panel')) return;
                syncUi();
                var frameCount = frames().length;
                if (frameCount !== lastFrameCount) {
                    lastFrameCount = frameCount;
                    scheduleFrameSync(300);
                }
            }, 200);
        });
        observer.observe(document.body || root, { childList: true, subtree: true });
    } catch (_) { /* ignore */ }

    // 首帧只读不写：否则会触发原生壳 recreate 自举
    paint({ persist: false });
    if (isTop) {
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', syncUi);
        else syncUi();
    }

    window.RPHubThemeKit = Object.freeze({
        get scheme() { return schemeNow(); },
        get accent() { return accentNow() || ''; },
        get schemes() { return SCHEMES.map(function (s) { return { key: s.key, label: s.label }; }); },
        get presets() { return PRESETS.map(function (p) { return { name: p[0], color: p[1] }; }); },
        setScheme: setScheme,
        setAccent: setAccent,
        toggleDayNight: toggleDayNight,
        refresh: function () { paint(); syncUi(); },
        css: kitCss
    });
})();
/* bracket-balance pad:  */
</script>
<style id="rphub-theme-kit-leak">
/* [rphub 2.8.77] 护眼两档的白方块补齐。
   本站 theme.css / styles.css 里没有任何 .bg-white 定义 —— Tailwind 由
   cdn.tailwindcss.com 运行时生成，tailwind-theme.js 的 colors 映射里也没有
   white，所以 bg-white 是写死的 #fff，不跟令牌走。
   日间档本来就是白底，夜间档由原生 Force Dark（data-app-theme=dark + 我们压掉
   color-scheme 解锁算法暗化）压暗，只有护眼两档会露：eye 是 light 档、Force Dark
   关闭，纯白卡片直接压在暖纸底上。
   只换不透明的那一档 [class~="bg-white"]；bg-white/20、/40、/70 这类是压在图片和
   彩色底上的玻璃层，白色是有意的，不能一起换掉。 */
:root[data-rphub-scheme="eye"] [class~="bg-white"],
:root[data-rphub-scheme="eyeNight"] [class~="bg-white"] {
    background-color: var(--c-surface) !important;
}
</style>
</body>

</html>
