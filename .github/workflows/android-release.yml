name: Publish verified Android APK
run-name: Android ${{ inputs.version }} / ${{ inputs.verify_only && 'verify only' || 'publish' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v, for example 2.9.134'
        required: true
        type: string
      verify_only:
        description: 'Only verify; do not create or edit a release'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: android-stable-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify and publish signed APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Run this workflow from main."
            exit 1
          fi
          version="$RELEASE_VERSION"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]{3}$ ]]
          tag="v$version"
          git merge-base --is-ancestor "refs/tags/$tag" origin/main
          apk="RP-local-$version.apk"
          checksum="SHA256SUMS-$version.txt"
          verification="$RUNNER_TEMP/release-verification"
          if gh release view "$tag" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-state"; then
            if grep -qx false "$RUNNER_TEMP/release-state"; then
              gh release download "$tag" --pattern "$apk" --pattern "$checksum" --dir "$verification"
              (cd "$verification" && sha256sum --check "$checksum")
              echo "Verified existing $tag; the published release was left unchanged." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          latest="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)"
          python3 scripts/check-release.py "$version" --latest "$latest"
          prepared="$RUNNER_TEMP/release-prepared"
          mkdir -p "$prepared"
          notes="$prepared/RELEASE-$version.md"
          git show "$tag:dist/$checksum" > "$prepared/$checksum"
          git show "$tag:dist/RELEASE-$version.md" > "$notes"
          source="$(gh api "repos/$GH_REPO/commits/codex/download-$version" --jq .sha)"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/$GH_REPO/$source/dist/$apk" -o "$prepared/$apk"
          (cd "$prepared" && sha256sum --check "$checksum")
          if [[ "$VERIFY_ONLY" == true ]]; then
            echo "Prepared $tag passed verification; no release was created or edited." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if gh release view "$tag" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-state"; then
            grep -qx true "$RUNNER_TEMP/release-state"
            gh release upload "$tag" "$prepared/$apk" "$prepared/$checksum" --clobber
          else
            gh release create "$tag" "$prepared/$apk" "$prepared/$checksum" \
              --verify-tag --draft --title "$version" --notes-file "$notes"
          fi
          gh release download "$tag" --pattern "$apk" --pattern "$checksum" --dir "$verification"
          (cd "$verification" && sha256sum --check "$checksum")
          gh release edit "$tag" --draft=false --latest --title "$version" --notes-file "$notes"
