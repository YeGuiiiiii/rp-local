name: Build iOS prototype
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare current web assets
        run: |
          npm ci --prefix scripts/ui-build
          node scripts/build-stream.cjs
          node scripts/compile-ui.cjs
          node --test scripts/test-ios-bridge.cjs
          node scripts/prepare-ios.cjs
      - name: Install project generator
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Test native storage on simulator
        shell: bash
        run: |
          device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPhone") and d["isAvailable"]))')"
          IOS_TEST_DESTINATION="platform=iOS Simulator,id=$device" bash ios/build.sh test
      - name: Build unsigned IPA
        run: bash ios/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RP-local-iOS-unsigned
          path: ios/build/*-unsigned.ipa
          if-no-files-found: error
